[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thisreelorthat"
version = "0.1.0"
description = "Transport-agnostic adaptive movie quiz engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
api = []
dev = ["httpx>=0.27", "pytest>=8.2"]
test = ["httpx>=0.27", "pytest>=8.2"]

[tool.setuptools.packages.find]
include = ["engine*", "api*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
